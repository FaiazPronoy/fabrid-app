[project]
name = "fabrid-app"
version = "0.1.0"
description = "Web app that runs the fabric defect segmentation models on a photo"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["defects", "fakes", "conftest"]
